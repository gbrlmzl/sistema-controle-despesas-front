name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Evita rodar dois workflows redundantes quando um push também abre/atualiza PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # NODE_ENV=test é setado pelo próprio Jest, então .env.test (versionado,
      # sem segredo) já é carregado automaticamente pelo next/jest — sem
      # precisar declarar API_URL aqui.
      - run: npm run test:coverage -- --ci

  build:
    name: Build de produção
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # src/lib/apiClient.ts, src/proxy.ts e src/app/api/[...path]/route.ts
      # lançam erro se API_URL estiver vazia (fail-fast em runtime), e o
      # `next build` avalia esses módulos durante "Collecting page data" —
      # então mesmo esta build de validação, que nunca vai virar imagem,
      # precisa de um valor não-vazio aqui. Não precisa ser o valor real: o
      # endereço da API só importa em runtime (ver docs/problema-rewrite-api-build-time.md,
      # Abordagem B). Fora do NODE_ENV=test o Next não carrega
      # .env.test/.env.local sozinho, então precisa vir do ambiente do step.
      - run: npm run build
        env:
          API_URL: http://localhost:8080

  docker-publish:
    name: Build e publica imagem Docker (GHCR)
    needs: build
    # Só publica a partir de push direto no branch principal — PRs só
    # validam build/lint/test acima.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Habilita a emulação necessária pro buildx cross-compilar arm64 neste
      # runner amd64 (ubuntu-latest). Sem QEMU, "platforms: linux/arm64" abaixo
      # falha — mesma peça usada na API (sistema-controle-despesas-api,
      # commit 365de83).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Só linux/arm64: o único destino de deploy é uma instância Graviton
          # (t4g.small). Multi-arch (linux/amd64,linux/arm64) foi cogitado, mas
          # custaria tempo extra de build via emulação QEMU sem uso real hoje —
          # mesma escolha feita na API (sistema-controle-despesas-api, commit
          # 365de83). Se o front um dia precisar rodar em x86, é só somar
          # "linux/amd64" aqui.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Placeholder fixo, não a Repository Variable "API_URL" de antes: desde
          # a Abordagem B (docs/problema-rewrite-api-build-time.md), o endereço
          # da API não fica mais congelado em nenhum manifesto — o Route Handler
          # em src/app/api/[...path]/route.ts lê process.env.API_URL a cada
          # requisição, em runtime. Este build-arg só existe para satisfazer o
          # guard de "não suba sem API_URL configurada" que o `next build`
          # avalia em Collecting page data (ver comentário no Dockerfile); o
          # valor em si não sobrevive à imagem publicada. O endereço real é
          # responsabilidade só do ambiente do container (ECS, task
          # definition) — ver README, seção "Variáveis de ambiente". Antes
          # desta mudança, esquecer de configurar a Repository Variable
          # "API_URL" no GitHub congelava esse placeholder na imagem e
          # quebrava toda chamada feita pelo navegador em produção — foi o
          # incidente de 20/08/2026. Essa classe de erro deixou de existir.
          build-args: |
            API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    name: Disparar e2e no repo de deploy
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pede pro repo orquestrador (sistema-controle-despesas-deploy) rodar o
      # e2e contra este SHA exato — se passar, ele re-taggeia esta imagem
      # (tag "sha-<sha completo>", gerada no job anterior) como :stable.
      # Isolado num job próprio: se o curl falhar (ex.: secret ainda não
      # configurado), só este job fica vermelho — a imagem já publicada em
      # "docker-publish" continua contando como sucesso.
      - name: Disparar e2e
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gbrlmzl/sistema-controle-despesas-deploy/dispatches \
            -d '{"event_type":"front-published","client_payload":{"sha":"${{ github.sha }}","image_tag":"sha-${{ github.sha }}"}}'
