# Sobe só o front, de propósito: a API (sistema-controle-despesas-api) tem
# compose próprio, e é ele que sobe a API junto com o Postgres dela. Para o
# sistema inteiro integrado (front + API + banco), use o repo orquestrador
# sistema-controle-despesas-deploy. Aponte API_URL para onde a API estiver
# ouvindo (default assume API rodando no host, na porta 3001).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sistema-controle-despesas-front
    environment:
      NODE_ENV: development
      API_URL: ${API_URL:-http://host.docker.internal:3001}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    volumes:
      - .:/app-node
      - /app-node/node_modules
      - /app-node/.next
    extra_hosts:
      # Permite "host.docker.internal" também em Docker Engine no Linux
      # (no Docker Desktop, Windows/Mac, já funciona nativamente).
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "-c"]
    command: ["npm install && npm run dev"]
